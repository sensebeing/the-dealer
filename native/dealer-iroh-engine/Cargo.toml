[package]
name = "dealer-iroh-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iroh = "0.35"
iroh-gossip = "0.35"
iroh-blobs = { version = "0.35", features = ["rpc"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
anyhow = "1"
futures-lite = "2"
n0-future = "0.1"
